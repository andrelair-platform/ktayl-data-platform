version: 2

# RAW layer — landed 1:1 from the live ktayl-policy-service Postgres by the ingestion CronJob
# (full-refresh copy for slice 1; CDC later). These are the ONLY real columns that exist — the
# data product is a contract over exactly these fields (dbt tests enforce that below).
sources:
  - name: policy_raw
    schema: raw
    description: "1:1 landing of ktayl-policy-service tables (source of truth = the Policy domain)."
    tables:
      - name: policies
        columns:
          - name: id
            tests: [unique, not_null]
          - name: policy_number
            tests: [unique, not_null]
          - name: status
            tests:
              - accepted_values: { values: ['draft','active','suspended','terminated'] }
          - name: product_code
            tests: [not_null]
          - name: effective_date
            tests: [not_null]
          - name: expiry_date
            tests: [not_null]
      - name: coverages
        columns:
          - name: id
            tests: [unique, not_null]
          - name: policy_id
            tests: [not_null]
          - name: insured_amount
            tests: [not_null]
      - name: premiums
        columns:
          - name: id
            tests: [unique, not_null]
          - name: policy_id
            # DP-007 interim contract (TRIPWIRE): `unique` asserts ONE premium row per policy = the
            # recurring *schedule* at its frequency, so annual GWP = amount × cadence is authoritative.
            # Premium management is a *future* domain (policy-service ports.go: "future premium management
            # stories"); if it later ships per-installment rows this test FAILS the build → forces the GWP
            # annualisation to be revisited (switch to sum(amount)) before a wrong figure is served. Issue #7.
            tests: [not_null, unique]
          - name: amount
            tests: [not_null]
          - name: frequency
            tests:
              - accepted_values: { values: ['monthly','quarterly','annual'] }
