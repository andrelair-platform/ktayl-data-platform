name: BMAD Sync

# Per-product BMAD for the ktayl Data Platform (IS Foundations / Project #5). This is the product
# HOME repo: stories live under bmad/stories/ and sync to GitHub Issues via the org-shared reusable
# workflow. Each story's frontmatter (repo:/project:/milestone:) routes the created issue to this
# repo + the Data Platform board (#5). See andrelair-platform rules bmad.md (Per-product BMAD).

on:
  push:
    branches: [main]
    paths:
      - 'bmad/stories/**'
  workflow_dispatch:

jobs:
  bmad-sync:
    uses: andrelair-platform/.github/.github/workflows/bmad-sync.yml@main
    secrets: inherit
