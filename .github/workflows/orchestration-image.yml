name: Orchestration image

# Builds the Dagster code-location image (dlt + dbt + Dagster + ML) → ghcr. Triggers on any branch when
# orchestration/** changes so a proof can pull the image before merge; tag = short SHA.
on:
  push:
    paths: ["orchestration/**", ".github/workflows/orchestration-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "tags=ghcr.io/andrelair-platform/ktayl-data-platform-orchestration:${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: orchestration
          file: orchestration/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tags }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign ghcr image
        run: cosign sign --yes ghcr.io/andrelair-platform/ktayl-data-platform-orchestration@${{ steps.build.outputs.digest }}
